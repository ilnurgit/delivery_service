name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose (CI)
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=delivery
          POSTGRES_USER=delivery
          POSTGRES_PASSWORD=delivery
          POSTGRES_PORT=5434

          RABBITMQ_DEFAULT_USER=guest
          RABBITMQ_DEFAULT_PASS=guest

          DATABASE_URL=postgresql+asyncpg://delivery:delivery@postgres:5432/delivery
          REDIS_URL=redis://redis:6379/0
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
          EOF

      - name: Build and start services (CI)
        run: |
          docker compose up -d --build postgres redis rabbitmq migrate api

      - name: Show running containers
        run: docker compose ps

      - name: Wait for infra to be healthy
        run: |
          echo "Waiting for postgres / redis / rabbitmq..."
          for i in {1..30}; do
            pg=$(docker inspect -f '{{.State.Health.Status}}' delivery_postgres 2>/dev/null || echo "unknown")
            rd=$(docker inspect -f '{{.State.Health.Status}}' delivery_redis 2>/dev/null || echo "unknown")
            rmq=$(docker inspect -f '{{.State.Health.Status}}' delivery_rabbitmq 2>/dev/null || echo "unknown")

            echo "postgres=$pg redis=$rd rabbitmq=$rmq"

            if [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ] && [ "$rmq" = "healthy" ]; then
              echo "All infra services are healthy"
              break
            fi

            sleep 2
          done

      - name: Create .env.test inside api container (for pytest conftest)
        run: |
          docker compose exec -T api sh -lc 'cat > /app/.env.test << "EOF"
          DATABASE_URL=postgresql+asyncpg://delivery:delivery@postgres:5432/delivery_test
          REDIS_URL=redis://redis:6379/0
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
          EOF
          ls -la /app/.env.test
          '

      - name: Run pytest (inside api container)
        run: |
          docker compose exec -T api uv run pytest -q

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Shutdown
        if: always()
        run: docker compose down -v
