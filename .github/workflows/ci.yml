name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker info
        run: docker version

      - name: Build and start services (CI)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up -d --build \
            postgres redis rabbitmq migrate api

      - name: Show running containers
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

      - name: Wait for infra to be healthy
        run: |
          echo "Waiting for postgres / redis / rabbitmq..."
          for i in {1..30}; do
            pg=$(docker inspect -f '{{.State.Health.Status}}' delivery_postgres 2>/dev/null || echo "unknown")
            rd=$(docker inspect -f '{{.State.Health.Status}}' delivery_redis 2>/dev/null || echo "unknown")
            rmq=$(docker inspect -f '{{.State.Health.Status}}' delivery_rabbitmq 2>/dev/null || echo "unknown")

            echo "postgres=$pg redis=$rd rabbitmq=$rmq"

            if [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ] && [ "$rmq" = "healthy" ]; then
              echo "All infra services are healthy"
              break
            fi

            sleep 2
          done

      - name: Run pytest
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            exec -T \
            -e DATABASE_URL="postgresql+asyncpg://delivery:delivery@postgres:5432/delivery_test" \
            -e REDIS_URL="redis://redis:6379/0" \
            -e RABBITMQ_URL="amqp://guest:guest@rabbitmq:5672//" \
            api uv run pytest -q

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            logs --no-color --tail=300

      - name: Shutdown
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            down -v
